spring:
  application:
    name: mall-server
  
  profiles:
    active: dev
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  # Hikari 连接池配置（dev模式生效，sharding模式由ShardingSphere接管）
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: root
    password: root123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: your-256-bit-secret-key-for-jwt-signing-must-be-long-enough-2024
  expiration: 86400000  # 24小时（毫秒）

# 订单超时配置（分钟）
order:
  timeout:
    minutes: 30

# 安全配置
security:
  # 限流配置
  rate-limit:
    enabled: true
    login-rate: 5        # 登录接口每秒5个请求
    login-capacity: 10   # 登录接口突发容量10
    global-rate: 100     # 全局每秒100个请求
    global-capacity: 200
    block-duration: 300  # IP封禁时长（秒）
    max-fail-attempts: 5 # 连续失败登录次数阈值
    fail-block-duration: 600 # 连续失败后封禁时长（秒）
  # XSS防护配置
  xss:
    enabled: true
    filter-params: true
    filter-body: true
    filter-headers: false
    replacement: ""

# 文件上传配置
file:
  upload:
    path: /tmp/mall-uploads
    base-url: http://localhost:8080/files
    chunk-size: 5242880  # 5MB
    max-file-size: 104857600  # 100MB
    allowed-extensions: jpg,jpeg,png,gif,bmp,webp,mp4,avi,mov,wmv,flv,mp3,wav,flac,aac,ogg,pdf,doc,docx,xls,xlsx,ppt,pptx,txt

# 服务端口
server:
  port: 8080
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    com.mall: DEBUG
    com.mall.task: DEBUG
    org.apache.shardingsphere: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
